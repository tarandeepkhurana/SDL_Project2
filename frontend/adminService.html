<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Requests</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #a3d5ff 40%, #d7edff 100%);
            margin: 0;
            padding: 0;
        }

        /* Header */
        h1 {
            color: #2c3e50;
            margin: 20px 0;
            font-size: 28px;
            font-weight: 600;
        }

        /* Form Styling (Resident Page) */
        form {
            margin: 20px auto;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        input,
        select,
        textarea {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
            box-shadow: 0px 0px 5px rgba(52, 152, 219, 0.5);
        }

        /* Submit & Complete Buttons */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background: #00c6ff;
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(0, 198, 255, 0.5);
        }

        /* Container for Pending & Completed Sections */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 1100px;
        }

        /* Request Sections */
        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            transition: all 0.3s ease;
        }

        h2 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* List Styling */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            border-radius: 5px;
            transition: 0.3s ease-in-out, transform 0.2s;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.05);
        }

        li:hover {
            background: #ecf0f1;
            transform: translateY(-3px);
        }

        /* Status Buttons */
        .complete-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease, transform 0.2s;
        }

        .complete-btn:hover {
            background-color: #219150;
            transform: scale(1.1);
            box-shadow: 0px 3px 8px rgba(39, 174, 96, 0.5);
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                justify-content: space-between;
            }

            .section {
                width: 48%;
            }
        }
    </style>
</head>

<body>
    <h1>Admin - Manage Complaints & Service Requests</h1>
    <div class="container">
        <div class="section">
            <h2>Pending Requests</h2>
            <ul id="pending-list"></ul>
        </div>
        <div class="section">
            <h2>Completed Requests</h2>
            <ul id="completed-list"></ul>
        </div>
    </div>

    <script>
        const fetchRequests = () => {
            // Fetch pending requests
            fetch('http://localhost:5000/auth/admin/pending-requests')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("pending-list").innerHTML = data.map(item =>
                        `<li><strong>${item.type}:</strong> ${item.title} - ${item.description} 
                <button class="complete-btn" onclick="markCompleted(${item.id})">Complete</button></li>`
                    ).join('');
                })
                .catch(console.error);

            // Fetch completed requests
            fetch('http://localhost:5000/auth/admin/completed-requests')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("completed-list").innerHTML = data.map(item =>
                        `<li><strong>${item.type}:</strong> ${item.title} - ${item.description}</li>`
                    ).join('');
                })
                .catch(console.error);
        };

        // Function to mark request as completed
        const markCompleted = id => {
            fetch(`http://localhost:5000/auth/update-status/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" }
            })
                .then(() => fetchRequests())  // 🔹 Call fetchRequests() to refresh both sections
                .catch(console.error);
        };

        // Fetch requests when the page loads
        fetchRequests();

    </script>
</body>

</html>
