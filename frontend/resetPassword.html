<!DOCTYPE html>
<html lang="en">
<head>

    <title>Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

        <h2>Enter New Password</h2>

        <p id="responseMessage"></p>
        <p><a href="index.html">Back to Login</a></p>
    </div>
    <script src="js/forgotPassword.js"></script>
</body>
</html>
