<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard Dashboard - ResiCare</title>
    <link rel="stylesheet" href="css/guard.css">
</head>
<body data-role="resident">

    <div class="container">
        <h2>Security Guards List</h2>

        
        <!-- Guard Table -->
        <div class="table-container">
            <table id="guardTable">
                <thead>
                    <tr>
                        <th>Badge Number</th>
                        <th>Name</th>
                        <th>Contact No</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="guardTableBody"> 
                    <!-- Guard records will be inserted here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/guard.js"></script>

</body>
</html>
