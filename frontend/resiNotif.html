<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Dashboard</title>
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a3d5ff 40%, #d7edff 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
            height: 100vh;
        }

        /* Main Container */
        .container {
            width: 80%;
            background: gainsboro;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Dashboard Layout */
        .dashboard {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* Section Styling */
        .section {
            width: 48%;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .section h3 {
            margin-bottom: 10px;
            color: #333;
        }

        /* Input Fields */
        input,
        textarea {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Buttons */
        button {
            width: 95%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table,
        th,
        td {
            border: 1px solid #ddd;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        /* Delete Button */
        .delete-btn {
            background-color: #dc3545;
            padding: 8px 12px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body data-role="resident">
    <div class="container">
        <h2>Resident Dashboard</h2>
        <div class="dashboard">
            <!-- Notifications Section -->
            <div class="section">
                <h3>Notifications</h3>
                <table id="notifications-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="notifications-list">
                        <!-- Notifications will be loaded here dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Alerts Section -->
            <div class="section">
                <h3>Alerts</h3>
                <table id="alerts-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-list">
                        <!-- Alerts will be loaded here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/Notif.js"></script>
</body>

</html>
