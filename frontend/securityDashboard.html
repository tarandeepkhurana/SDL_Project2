<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 40px auto;
        }

        .grid-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }

        .grid-title {
            font-size: 18px;
            font-weight: bold;
            display: block;
            text-decoration: none;
            color: #333;
            margin-bottom: 10px;
        }

        .grid-title:hover {
            text-decoration: underline;
        }

        .dropdown-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #007bff;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .grid-description {
            font-size: 14px;
            color: #555;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease-in, opacity 0.3s ease-in;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>ResiCare - Security Dashboard</h2>
    </nav>

    <!-- Grid Section -->
    <div class="dashboard-grid">
    
    </div>
    <script>
        function toggleDescription(index) {
            const descriptions = document.querySelectorAll(".grid-description");

            descriptions.forEach((desc, i) => {
                if (i === index) {
                    desc.style.maxHeight = desc.style.maxHeight ? null : desc.scrollHeight + "px";
                    desc.style.opacity = desc.style.opacity === "1" ? "0" : "1";
                } else {
                    desc.style.maxHeight = null;
                    desc.style.opacity = "0";
                }
            });
        }

    </script>
</body>

</html>
